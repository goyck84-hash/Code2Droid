
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code2Droid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #090d18;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
        }

        h1 {
            color: #42a5ff;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #9baac2;
        }

        textarea {
            width: 100%;
            height: 250px;
            margin-top: 20px;
            padding: 15px;
            background: #151e30;
            color: #80ffbb;
            border: 1px solid #30415d;
            border-radius: 12px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border-radius: 10px;
            border: 1px solid #30415d;
            background: #151e30;
            color: white;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #1685ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        button:active {
            background: #0862c4;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #151e30;
            color: #9baac2;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Code2Droid</h1>

    <p class="subtitle">
        Turn your C++ code into Android apps
    </p>

    <input
        type="text"
        id="appName"
        placeholder="Application name"
    >

    <textarea
        id="cppCode"
        placeholder="Paste your C++ code here..."
    ></textarea>

    <button onclick="generate()">
        GENERATE APK
    </button>

    <div class="status" id="status">
        Ready to build your application.
    </div>

</div>

<script>
function generate() {
    let code = document.getElementById("cppCode").value;
    let name = document.getElementById("appName").value;

    if (code.trim() === "" || name.trim() === "") {
        document.getElementById("status").innerText =
            "Please enter application name and C++ code!";
        return;
    }

    document.getElementById("status").innerText =
        "Code received! APK compiler will be connected soon.";
}
</script>

</body>
</html>
